        /* ===============================
 LANDSCAPE
   TYPING AREA RESPONSIVE SYSTEM
   Landscape: Paragraph + Input Side by Side
   Portrait: Stack Layout
========================================== */


/* Default Layout */
.typing-area{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:15px;

}


/* Paragraph Box */

#display-text{ position: relative;

    width:100%;

    min-height:120px;

    max-height:130px;

    overflow-y:auto;

    box-sizing:border-box;

}



/* Input Box */

textarea#input-area{

    width:100%;

    min-height:120px;

    box-sizing:border-box;

}





/* ==========================================
   MOBILE LANDSCAPE + TABLET + DESKTOP
========================================== */


@media (orientation:landscape){


    .typing-area{

        display:grid;

        grid-template-columns:1fr 1fr;

        gap:15px;

        align-items:stretch;

        width:100%;

    }



    #display-text{ position: relative;

        min-height:120px; !important;

        max-height:130px; !important;

        font-size:20px; !important;

        padding:18px; !important;

        overflow-y:auto;

    }



    textarea#input-area{

        height:120px; !important;

        min-height:120px; !important;

        font-size:20px; !important;

        padding:18px; !important;

    }


}





/* ==========================================
   SMALL PORTRAIT MOBILE
========================================== */


@media (max-width:699px) and (orientation:portrait){


    .typing-area{

        display:block;

    }



    #display-text{ position: relative;

        margin-bottom:15px;

        min-height:160px;

        font-size:21px;

    }



    textarea#input-area{

        height:130px;

        min-height:120px;

        font-size:20px;

    }


}





/* ==========================================
   LARGE SCREEN OPTIMIZATION
========================================== */


@media (min-width:1000px){


    .typing-area{

        gap:25px;

    }



    #display-text{ position: relative;

        font-size:24px;

    }



    textarea#input-area{

        font-size:24px;

    }


}

/* =========================
   GLOBAL
========================= */

*{
    box-sizing:border-box;
}


html,body{

    width:100%;
    min-height:100%;

    margin:0;

}


body{

    padding:8px;

    font-family:

    'Hind Siliguri',

    background:var(--bg);

    color:var(--text-main);

}




/* =========================
   MAIN CONTAINER
========================= */


.container{

    width:100%;

    max-width:none;

    min-height:100vh;

    margin:auto;

    padding:15px;

    background:var(--card-bg);

    border-radius:20px;

    box-shadow:
    0 15px 35px rgba(0,0,0,.15);

}



/* =========================
   HEADER
========================= */


.branding-container{

    text-align:center;

    margin-bottom:20px;

}


.main-title{

    margin:0;

    font-size:32px;

    color:var(--primary);

    font-weight:800;

}


.sub-branding{

    margin-top:5px;

    color:var(--accent);

    font-weight:bold;

}



/* =========================
   SELECT AREA
========================= */


.setup-row{

    display:flex;

    gap:10px;

    margin-bottom:15px;

}


select,
button,
input,
textarea{

    font-family:inherit;

    font-size:16px;

}





/* =========================
   MEANING
========================= */


#meaning-display{

    text-align:center;

    color:var(--secondary);

    font-size:20px;

    font-weight:bold;

    min-height:30px;

}



/* =========================
   MAIN TYPING AREA
========================= */


.typing-area{


    display:grid;

    grid-template-columns:

    1fr 1fr;


    gap:20px;


    width:100%;


}




/* Paragraph Box */


#display-text{ position: relative;


    background:var(--display-bg);


    color:var(--display-text);


    border-left:

    8px solid var(--accent);


    border-radius:15px;


    padding:25px;


    min-height:130px;


    max-height:140px;


    overflow-y:auto;


    font-size:22px;


    line-height:1.8;


    word-break:break-word;


}



/* Characters */


.char{

    white-space:pre-wrap;

}


.correct{

    color:#4caf50;

}


.wrong{

    color:white;

    background:#ff1744;

}


.current{

    background:rgba(0,184,212,.3);

    border-bottom:3px solid var(--accent);

}




/* Input Box */


textarea#input-area{


    width:100%;


    height:130px;


    padding:25px;


    border:

    3px solid var(--primary);


    border-radius:15px;


    resize:none;


    font-size:22px;


    line-height:1.8;


    background:var(--card-bg);


    color:var(--text-main);


}




/* =========================
   STATS
========================= */


.stats{

    display:flex;

    gap:10px;

    margin-top:20px;

}


.stat-box{

    flex:1;

    background:var(--primary);

    color:white;

    padding:12px;

    border-radius:12px;

    text-align:center;

}


.stat-box span{

    display:block;

    font-size:22px;

    color:#ffeb3b;

}




/* =========================
   SIDEBAR
========================= */


.sidebar{

    position:fixed;

    top:0;

    right:-350px;

    width:300px;

    height:100%;


    background:var(--card-bg);


    padding:25px;


    transition:.3s;


    z-index:1000;

}


.sidebar.active{

    right:0;

}



/* =========================
   BUTTON
========================= */


.toggle-btn{

    position:fixed;

    top:20px;

    right:20px;


    width:45px;

    height:45px;


    border:none;

    border-radius:50%;


    background:var(--accent);

    color:white;

    font-size:22px;

    z-index:1200;

}





/* =========================
   PWA INSTALL BAR
========================= */


.pwa-bar{

    position:flex;

    bottom:20px;

    left:20px;


    display:flex;

    gap:10px;

    align-items:center;


    padding:10px 15px;


    background:#121212;

    color:white;


    border-radius:15px;


    z-index:2000;

}




/* =========================
   PORTRAIT MODE
========================= */


@media screen and (orientation:portrait){


    body{

        padding:10px;

    }


    .typing-area{

        grid-template-columns:1fr;

    }


    textarea#input-area{

        height:140px;

        font-size:20px;

    }


    #display-text{ position: relative;

        min-height:170px;

        font-size:20px;

    }


    .setup-row{

        display:grid;

        grid-template-columns:1fr 1fr;

    }

}



/* =========================
   SMALL MOBILE
========================= */


@media(max-width:500px){


    .container{

        padding:15px;

        border-radius:12px;

    }


    .main-title{

        font-size:25px;

    }


}

    let customs = JSON.parse(localStorage.getItem('rah_v11_cust')) || [];
    
    
    let chars = [], timer = null, time = 0, active = false, done = false;
    const segmenter = new Intl.Segmenter('bn', { granularity: 'grapheme' });

    const bijoyMap = {
        'q': 'ঙ', 'w': 'য', 'e': 'ড', 'r': 'প', 't': 'ট', 'y': 'চ', 'u': 'জ', 'i': 'হ', 'o': 'গ', 'p': 'ড়', '\\': 'ৎ',
        'a': 'ৃ', 's': 'ু', 'd': 'ি', 'f': 'া', 'g': '্', 'h': 'ব', 'j': 'ক', 'k': 'ত', 'l': 'দ',
        'z': '্র', 'x': 'ও', 'c': 'ে', 'v': 'র', 'b': 'ন', 'n': 'স', 'm': 'ম',
        'Q': 'ং', 'W': 'য়', 'E': 'ঢ', 'R': 'ফ', 'T': 'ঠ', 'Y': 'ছ', 'U': 'ঝ', 'I': 'ঞ', 'O': 'ঘ', 'P': 'ঢ়','|': 'ঃ',
        'A': 'র্', 'S': 'ূ', 'D': 'ী', 'F': 'অ', 'G': '।', 'H': 'ভ', 'J': 'খ', 'K': 'থ', 'L': 'ধ',
        'Z': '্য', 'X': 'ৗ', 'C': 'ৈ', 'V': 'ল', 'B': 'ণ', 'N': 'ষ', 'M': 'শ',
        '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯', '0': '০', '&': 'ঁ'
    };

    // ১. প্রথমে initApp ফাংশনটি এভাবে আপডেট করুন
function initApp() {
    const lang = document.getElementById('lang').value;
    const mode = document.getElementById('mode').value;
    const sel = document.getElementById('lesson-sel');
    let pool = [];
    const englishWords = Object.keys(meanings);

    if (mode === 'words') {
        const src = (lang === 'bn' ? bnW : englishWords);
        pool = src.map((w, i) => {
            let text = lang === 'en' ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() + (" " + w.toLowerCase()).repeat(4)) : Array(5).fill(w).join(' ');
            return { n: `W-${i+1}: ${w}`, t: text, m: lang === 'en' ? meanings[w] : "" };
        });
    } else if (mode === 'para') {
        const src = (lang === 'bn' ? bnP : enP);
        for (let i = 0; i < src.length; i += 10) {
            pool.push({ n: `Set: ${Math.floor(i/10) + 1}`, t: src.slice(i, i + 10).join(' '), m: "" });
        }
    } else if (mode === 'custom') {
        pool = customs.map((c, i) => ({ n: `Saved-${i+1}`, t: c, m: "" }));
    }
    
    window.activePool = pool;
    sel.innerHTML = pool.map((d, i) => `<option value="${i}">${d.n}</option>`).join('');

    // এখানে হিস্টোরি লোড হচ্ছে
    const storageKey = `rah_last_idx_${lang}_${mode}`;
    const savedIdx = localStorage.getItem(storageKey);
    if (savedIdx !== null && sel.options[savedIdx]) {
        sel.value = savedIdx;
    } else {
        sel.value = 0;
    }
    
    loadLesson();
}

// ২. এরপর এই loadLesson ফাংশনটি রাখুন
function loadLesson() {
    const lang = document.getElementById('lang').value;
    const mode = document.getElementById('mode').value;
    const idx = document.getElementById('lesson-sel').value;
    
    // বর্তমান ইনডেক্স সেভ করে রাখা
    localStorage.setItem(`rah_last_idx_${lang}_${mode}`, idx);

    if(window.activePool && window.activePool[idx]) {
        const data = window.activePool[idx];
        document.getElementById('meaning-display').innerText = data.m ? `অর্থ: ${data.m}` : "";
        chars = Array.from(segmenter.segment(data.t)).map(s => s.segment);
        document.getElementById('display-text').innerHTML = chars.map((c, i) => `<span id="s-${i}" class="char">${c}</span>`).join('');
        resetApp();
    }
}


    const input = document.getElementById('input-area');

    let state = {
        pendingKar: "",
        gPressed: false
        
    };
    
    let isBijoyActive = true; // বাই ডিফল্ট বিজয় অন থাকবে

    
let testMode = false;
let wrongCount = 0;
    
    input.addEventListener('keydown', function(e) {
        const currentLang = document.getElementById('lang').value;
        if (currentLang === 'en') return;

        if (currentLang === 'bn' && isBijoyActive) {
    if (e.ctrlKey || e.altKey || e.metaKey || e.key.length > 1) return;
    // ... বিজয়ের বাকি লজিক


            if (e.key === 'Backspace') {
                state.pendingKar = "";
                state.gPressed = false;
                return;
            }

            if (bijoyMap.hasOwnProperty(e.key)) {
                e.preventDefault();
                let char = bijoyMap[e.key];
                let start = this.selectionStart;
                let end = this.selectionEnd;
                let val = this.value;

                if (e.key === ' ') {
                    state.pendingKar = "";
                    state.gPressed = false;
                    this.value = val.substring(0, start) + ' ' + val.substring(end);
                    this.selectionStart = this.selectionEnd = start + 1;
                    this.dispatchEvent(new Event('input'));
                    return;
                }

                if (e.key === 'g') {
                    state.gPressed = true;
                    return;
                }

                if (state.gPressed) {
                    let sworoborno = "";
                    if (e.key === 'd') sworoborno = 'ই';
                    else if (e.key === 'D') sworoborno = 'ঈ';
                    else if (e.key === 's') sworoborno = 'উ';
                    else if (e.key === 'S') sworoborno = 'ঊ';
                    else if (e.key === 'a') sworoborno = 'ঋ';
                    else if (e.key === 'c') sworoborno = 'এ';
                    else if (e.key === 'C') sworoborno = 'ঐ';
                    else if (e.key === 'x') sworoborno = 'ও';
                    else if (e.key === 'X') sworoborno = 'ঔ';
                    else if (e.key === 'f') sworoborno = 'আ';

                    if (sworoborno !== "") {
                        state.pendingKar = "";
                        state.gPressed = false;
                        this.value = val.substring(0, start) + sworoborno + val.substring(end);
                        this.selectionStart = this.selectionEnd = start + sworoborno.length;
                        this.dispatchEvent(new Event('input'));
                        return;
                    } else {
                        char = '্' + char;
                        state.gPressed = false;
                    }
                }

                if (['ে', 'ি', 'ৈ', ].includes(char) && state.pendingKar === "") {
                    state.pendingKar = char;
                    return;
                }

                if (e.key === 'A') {
                    if (start > 0) {
                        let textBefore = val.substring(0, start);
                        let lastChar = textBefore.slice(-1);
                        let restText = textBefore.slice(0, -1);
                        let finalBefore = "";

                        if (['ে', 'ি', 'ৈ', 'ৗ', 'ো', 'ৌ', 'া', 'ী', 'ূ', 'ু', 'ৃ'].includes(lastChar)) {
                            let targetChar = restText.slice(-1);
                            finalBefore = restText.slice(0, -1) + "র্" + targetChar + lastChar;
                        } else {
                            finalBefore = restText + "র্" + lastChar;
                        }

                        this.value = finalBefore + val.substring(end);
                        this.selectionStart = this.selectionEnd = finalBefore.length;
                    }
                }
                else if (state.pendingKar !== "") {
                    let combined = char + state.pendingKar;
                    this.value = val.substring(0, start) + combined + val.substring(end);
                    this.selectionStart = this.selectionEnd = start + combined.length;
                    state.pendingKar = "";
                }
                else if (char.startsWith('্')) {
                    let textBefore = val.substring(0, start);
                    let lastChar = textBefore.slice(-1);

                    if (['ে', 'ি', 'ৈ', 'ৗ', 'ো', 'ৌ'].includes(lastChar)) {
                        let newBefore = textBefore.slice(0, -1) + char + lastChar;
                        this.value = newBefore + val.substring(end);
                        this.selectionStart = this.selectionEnd = newBefore.length;
                    } else {
                        this.value = val.substring(0, start) + char + val.substring(end);
                        this.selectionStart = this.selectionEnd = start + char.length;
                    }
                }
                else {
                    let textBefore = val.substring(0, start);
                    let lastChar = textBefore.slice(-1);

                    if (lastChar === 'ে' && char === 'া') {
                        this.value = textBefore.slice(0, -1) + 'ো' + val.substring(end);
                        this.selectionStart = this.selectionEnd = start;
                    }
                    else if (lastChar === 'ে' && char === 'ৗ') {
                        this.value = textBefore.slice(0, -1) + 'ৌ' + val.substring(end);
                        this.selectionStart = this.selectionEnd = start;
                    }
                    else {
                        this.value = val.substring(0, start) + char + val.substring(end);
                        this.selectionStart = this.selectionEnd = start + char.length;
                    }
                }

                this.dispatchEvent(new Event('input'));
            }
        }
    });

    input.addEventListener('input', function() {
        if (!active && input.value.length > 0 && !done) {
            active = true;
            timer = setInterval(() => {
                time++;
                document.getElementById('st-time').innerText = time;
                calculateWPM();
            }, 1000);
        }
        updateTyping();
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (done) nextL();
            else if (input.value.length >= chars.length) finish();
        }
    });

            function updateTyping() {
        const typedRaw = input.value.normalize('NFC');
        const typed = Array.from(segmenter.segment(typedRaw)).map(s => s.segment);
        let correct = 0;
        wrongCount = 0;

        const maxLen = Math.max(typed.length + 2, chars.length);
        const displayDiv = document.getElementById('display-text');

        for(let i = 0; i < maxLen; i++) {
            const el = document.getElementById(`s-${i}`);
            if(!el) continue;

            const targetChar = chars[i] ? chars[i].normalize('NFC') : null;

            if(i < typed.length) {
                if(typed[i] === targetChar){

    correct++;

    if(testMode){

        el.className="char";

    }else{

        el.className="char correct";

    }


}else{

wrongCount++;
    if(testMode){

        el.className="char";

    }else{

        el.className="char wrong";

    }

}
            } else {
                if (i === typed.length) {
                    if(el.className !== "char current") el.className = "char current";
                } else {
                    if(el.className !== "char") el.className = "char";
                }
            }
        }

        // এক্সট্রা টাইপিং এবং সাধারণ টাইপিং উভয়ের জন্যই নিখুঁত স্ক্রোল ট্র্যাকিং
        if (done || typed.length >= chars.length) {
            // প্যারাগ্রাফ শেষ বা এক্সট্রা টাইপ করার সময় সবসময় স্ক্রোল একদম নিচে লক থাকবে
            displayDiv.scrollTop = displayDiv.scrollHeight;
        } else {
            // স্বাভাবিক টাইপিংয়ের সময় কারেন্ট এলিমেন্ট ট্র্যাক করবে
            const currentEl = document.getElementById(`s-${typed.length}`);
            if (currentEl) {
                const containerHeight = displayDiv.clientHeight;
                const elemTop = currentEl.offsetTop;
                const elemHeight = currentEl.offsetHeight;

                // কারেন্ট ক্যারেক্টারটি যদি স্ক্রিনের বাইরে চলে যেতে নেয়, তখনই স্ক্রোল পজিশন আপডেট হবে
                if ((elemTop + elemHeight) > (displayDiv.scrollTop + containerHeight) || elemTop < displayDiv.scrollTop) {
                    displayDiv.scrollTop = elemTop - (containerHeight / 2) + (elemHeight / 2);
                }
            }
        }

        if(typed.length > 0) {
            document.getElementById('st-acc').innerText = Math.round((correct/typed.length)*100) + "%";
            // 👇 লাইভ ভুল % দেখানোর লাইন
    document.getElementById('st-wrong').innerText = Math.round((wrongCount/typed.length)*100) + "%";

        }

                // শেষের অক্ষরটি সম্পূর্ণ টাইপ হয়েছে কিনা এবং যুক্তবর্ণের মোডে (gPressed / pendingKar) আছে কিনা তা যাচাই
        const isLastCharComplete = (typed.length > chars.length) || 
                                   (typed[typed.length - 1] === chars[chars.length - 1]);

        if (typed.length >= chars.length && !done && chars.length > 0 && !state.gPressed && state.pendingKar === "" && isLastCharComplete) {
            setTimeout(finish, 100);
        }

    }



    function finish() {

    done = true;
    active = false;
    clearInterval(timer);

    const wpm = document.getElementById('st-wpm').innerText;
    const acc = document.getElementById('st-acc').innerText;

    let wrongPercent = 0;

    if(chars.length > 0){
        wrongPercent = Math.round((wrongCount / chars.length) * 100);
    }

    document.getElementById('res-data').innerHTML =
    `
    গতি: <b>${wpm} WPM</b><br>
    নির্ভুলতা: <b>${acc}</b><br>
    সময়: <b>${time} সেকেন্ড</b><br>
    ভুল: <b>${wrongCount}</b> টি<br>
    Wrong: <b>${wrongPercent}%</b>
    `;

    document.getElementById('modal').style.display = "flex";
}

    function nextL() {
        document.getElementById('modal').style.display = "none";
        const sel = document.getElementById('lesson-sel');
        sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
        loadLesson();
        input.focus();
    }

    function resetApp() { clearInterval(timer); time = 0; active = false; done = false;
    wrongCount = 0;
    input.value = ""; state.pendingKar = ""; state.gPressed = false; document.getElementById('st-time').innerText = "0"; document.getElementById('st-wpm').innerText = "0"; document.getElementById('st-acc').innerText = "100%"; document.getElementById('display-text').scrollTop = 0; input.focus(); }
    function saveC() { const v = document.getElementById('c-in').value.trim(); if(v) { customs.push(v); localStorage.setItem('rah_v11_cust', JSON.stringify(customs)); document.getElementById('c-in').value=""; renderC(); initApp(); } }
    function renderC() { document.getElementById('c-list').innerHTML = customs.map((x,i)=>`<div style="font-size:11px; background:rgba(0,0,0,0.05); padding:6px; margin-top:5px; border-radius:4px; display:flex; justify-content:space-between;"><span>${x.slice(0,20)}...</span><b style="color:red; cursor:pointer;" onclick="delC(${i})">মুছুন</b></div>`).join(''); }
    function delC(i) { customs.splice(i,1); localStorage.setItem('rah_v11_cust', JSON.stringify(customs)); renderC(); initApp(); }
    function updateFSize(v) { document.getElementById('display-text').style.fontSize = v + "px"; }
    function updateFStyle(v) { document.getElementById('display-text').style.fontFamily = v + ", sans-serif"; document.getElementById('input-area').style.fontFamily = v + ", sans-serif"; }
    function updateTheme(v) { document.documentElement.setAttribute('data-theme', v); }

    function calculateWPM() {
        if (time <= 0) return;
        const typedRaw = input.value.normalize('NFC');
        const typed = Array.from(segmenter.segment(typedRaw)).map(s => s.segment);
        const wpm = Math.round((typed.length / 5) / (time / 60));
        document.getElementById('st-wpm').innerText = wpm >= 0 ? wpm : 0;
    }

    window.addEventListener('keydown', (e) => {
        const modal = document.getElementById('modal');
        if (done && modal.style.display === "flex") {
            if (e.key === 'Enter') { e.preventDefault(); nextL(); }
            else if (e.key === 'Escape') { e.preventDefault(); modal.style.display = "none"; fullResetCurrent(); }
            else { modal.style.display = "none"; input.focus(); }
        } else if (e.key === 'Escape') {
            fullResetCurrent();
        }
    });

    function fullResetCurrent() {
        input.value = ""; done = false; active = false; clearInterval(timer); time = 0; state.gPressed = false; state.pendingKar = "";
        document.getElementById('st-time').innerText = "0"; document.getElementById('st-wpm').innerText = "0"; document.getElementById('st-acc').innerText = "100%";
        document.getElementById('display-text').scrollTop = 0;
        chars.forEach((c, i) => {
            const el = document.getElementById(`s-${i}`);
            if (el) el.className = (i === 0) ? "char current" : "char";
        });
        input.focus();
    }

    window.addEventListener('load', () => { renderC(); initApp(); });

let deferredPrompt;
const pwaBar = document.getElementById('pwaBar');
const installButton = document.getElementById('installButton');

// শুরুতে বাটন লুকিয়ে রাখুন (যতক্ষণ না ব্রাউজার নিশ্চিত করে যে অ্যাপটি ইনস্টল করা সম্ভব)
if (pwaBar) {
    pwaBar.hidden = true;
}

// ১. অ্যাপটি ইনস্টল করার উপযোগী হলে এই ইভেন্ট ট্রিগার হবে
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    
    // ইতিমধ্যে অ্যাপ হিসেবে রান না হলে বাটন দেখাবে
    if (!window.matchMedia('(display-mode: standalone)').matches) {
        if (pwaBar) pwaBar.hidden = false;
    }
});

// ২. ইনস্টল বাটনে ক্লিক করলে প্রম্পট দেখাবে এবং পরে বাটন লুকিয়ে দেবে
if (installButton) {
    installButton.addEventListener('click', async () => {
        if (!deferredPrompt) return;

        // ব্রাউজারের ইনস্টল পপআপ দেখানো
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;

        if (outcome === 'accepted') {
            console.log('User accepted the PWA install');
        }

        deferredPrompt = null;
        // ক্লিক করার পর বাটন হাইড করা
        if (pwaBar) pwaBar.hidden = true;
    });
}

// ৩. ইনস্টল সম্পূর্ণ হয়ে গেলে নিশ্চিতভাবে বাটন লুকিয়ে রাখা
window.addEventListener('appinstalled', () => {
    if (pwaBar) pwaBar.hidden = true;
    deferredPrompt = null;
    console.log('PWA completely installed!');
});

// ৪. অ্যাপটি যদি ইতিমধ্যে ইনস্টলড থাকে এবং অ্যাপ হিসেবে ওপেন করা হয়
if (window.matchMedia('(display-mode: standalone)').matches) {
    if (pwaBar) pwaBar.hidden = true;
}

    </script>
