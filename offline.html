<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a237e">

<title>Typing Jobs Pro - Offline</title>

<style>
/* এখানে গুগল ফন্টের @import লাইনটি মুছে দেওয়া হয়েছে */

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#e0e4e8;
/* ইন্টারনেট ছাড়াও যেকোনো মোবাইলে/কম্পিউটারে এটি সুন্দর বাংলা ফন্ট দেখাবে */
font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Kalpurush", "SolaimanLipi", sans-serif;
}

.offline-box{
width:90%;
max-width:450px;
background:white;
padding:35px 25px;
border-radius:20px;
text-align:center;
box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.logo{
font-size:55px;
margin-bottom:15px;
}

h1{
color:#1a237e;
font-size:28px;
margin:10px 0;
}

p{
font-size:18px;
line-height:1.7;
color:#333;
}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:12px;
background:#1a237e;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#303f9f;
}

.footer{
margin-top:25px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<div class="offline-box">
<div class="logo">
⌨️
</div>

<h1>
Typing Jobs Pro v10.0
</h1>

<p>
ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না।<br>
আপনার সংরক্ষিত Typing Practice চালু থাকবে।
</p>

<button onclick="location.reload()">
আবার চেষ্টা করুন
</button>

<div class="footer">
MADE BY RAHMOTULLAH, CST-6,RU
</div>
</div>

</body>
</html>
